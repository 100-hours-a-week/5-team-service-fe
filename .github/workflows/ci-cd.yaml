name: Frontend Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main
    paths-ignore:
      - "*.md"
      - "docs/**"
  pull_request:
    types:
      - closed
    branches:
      - main
      - staging

concurrency:
  group: frontend-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-arm64:
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'staging')
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        run: |
          REGISTRY="${{ secrets.ECR_REGISTRY }}"
          REPOSITORY="doktori/frontend"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          if [ "${{ github.event_name }}" == "pull_request" ] && \
             [ "${{ github.event.pull_request.merged }}" == "true" ] && \
             [ "${{ github.event.pull_request.base.ref }}" == "staging" ]; then
            TAG="dev-staging"
          elif [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            TAG="dev-develop"
          elif [ "${{ github.ref }}" == "refs/heads/main" ] || \
               ( [ "${{ github.event_name }}" == "pull_request" ] && \
                 [ "${{ github.event.pull_request.merged }}" == "true" ] && \
                 [ "${{ github.event.pull_request.base.ref }}" == "main" ] ); then
            TAG="prod-${SHORT_SHA}"
          else
            TAG="dev-${SHORT_SHA}"
          fi
          {
            echo "tags<<EOF"
            echo "${REGISTRY}/${REPOSITORY}:${TAG}"
            echo "EOF"
          } >> $GITHUB_OUTPUT
          echo "image-tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare frontend build env file
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ] && \
             [ "${{ github.event.pull_request.merged }}" == "true" ] && \
             [ "${{ github.event.pull_request.base.ref }}" == "staging" ]; then
            cat <<'EOF' > .env.build
          NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL_STAGING }}
          NEXT_PUBLIC_CHAT_BASE_URL=${{ secrets.NEXT_PUBLIC_CHAT_BASE_URL_STAGING }}
          NEXT_PUBLIC_CHAT_WS_PATH=${{ secrets.NEXT_PUBLIC_CHAT_WS_PATH_STAGING }}
          NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_GA_ID=${{ secrets.NEXT_PUBLIC_GA_ID_PROD }}
          NEXT_PUBLIC_FIREBASE_APPID=${{ secrets.NEXT_PUBLIC_FIREBASE_APPID }}
          NEXT_PUBLIC_FIREBASE_VAPID_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
          NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN_PROD }}
          NEXT_PUBLIC_SENTRY_ENV=staging
          EOF
          elif [ "${{ github.ref }}" == "refs/heads/main" ] || \
               ( [ "${{ github.event_name }}" == "pull_request" ] && \
                 [ "${{ github.event.pull_request.merged }}" == "true" ] && \
                 [ "${{ github.event.pull_request.base.ref }}" == "main" ] ); then
            cat <<'EOF' > .env.build
          NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL_PROD }}
          NEXT_PUBLIC_CHAT_BASE_URL=${{ secrets.NEXT_PUBLIC_CHAT_BASE_URL_PROD }}
          NEXT_PUBLIC_CHAT_WS_PATH=${{ secrets.NEXT_PUBLIC_CHAT_WS_PATH_PROD }}
          NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_GA_ID=${{ secrets.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_FIREBASE_APPID=${{ secrets.NEXT_PUBLIC_FIREBASE_APPID }}
          NEXT_PUBLIC_FIREBASE_VAPID_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
          NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN_PROD }}
          NEXT_PUBLIC_SENTRY_ENV=production
          EOF
          else
            cat <<'EOF' > .env.build
          NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL_DEV }}
          NEXT_PUBLIC_CHAT_BASE_URL=${{ secrets.NEXT_PUBLIC_CHAT_BASE_URL_DEV }}
          NEXT_PUBLIC_CHAT_WS_PATH=${{ secrets.NEXT_PUBLIC_CHAT_WS_PATH_DEV }}
          NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_GA_ID=${{ secrets.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_FIREBASE_APPID=${{ secrets.NEXT_PUBLIC_FIREBASE_APPID }}
          NEXT_PUBLIC_FIREBASE_VAPID_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
          NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN_DEV }}
          NEXT_PUBLIC_SENTRY_ENV=development
          EOF
          fi

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          target: runner
          tags: ${{ steps.meta.outputs.tags }}
          secret-files: |
            frontend_env=.env.build

  deploy-dev:
    needs: build-and-push-arm64
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Deploy to Dev via SSM
        run: |
          COMMANDS=$(jq -n --arg registry "${{ secrets.ECR_REGISTRY }}" --arg tag "${{ needs.build-and-push-arm64.outputs.image-tag }}" '[
            "set -e",
            ("export ECR_REGISTRY=" + $registry),
            ("export IMAGE_URI=" + $registry + "/doktori/frontend:" + $tag),
            "export DOCKER_CONFIG=/tmp/.docker",
            "mkdir -p $DOCKER_CONFIG",
            "aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin $ECR_REGISTRY",
            "docker pull $IMAGE_URI",
            "docker rm -f doktori-frontend 2>/dev/null || true",
            "docker run -d --name doktori-frontend --restart unless-stopped -p 3000:3000 $IMAGE_URI",
            "docker ps --filter name=doktori-frontend --format \"table {{.Names}}\\t{{.Status}}\\t{{.Ports}}\"",
            "docker image prune -f"
          ]')

          CMD_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Environment,Values=dev" "Key=tag:Service,Values=front" \
            --parameters "{\"commands\": $COMMANDS}" \
            --timeout-seconds 300 \
            --comment "deploy dev frontend ${{ github.sha }}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command: $CMD_ID"

          for i in $(seq 1 60); do
            sleep 5
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$CMD_ID" \
              --query "CommandInvocations[0].Status" \
              --output text 2>/dev/null || echo "Pending")
            echo "[$i/60] $STATUS"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut|DeliveryTimedOut)
                aws ssm list-command-invocations --command-id "$CMD_ID" --details \
                  --query "CommandInvocations[0].CommandPlugins[0].Output" --output text || true
                exit 1 ;;
              None)
                if [ "$i" -ge 3 ]; then
                  echo "::error::No instance matched SSM target Environment=dev,Service=front"
                  exit 1
                fi ;;
            esac
          done
          echo "::error::SSM command timed out"
          exit 1

      - name: Notify Discord
        if: always()
        run: |
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          ACTIONS_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMIT_MSG="${{ github.event.pull_request.title }}"
            COMMIT_AUTHOR="${{ github.event.pull_request.user.login }}"
          else
            COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | head -1)
            COMMIT_AUTHOR="${{ github.event.head_commit.author.name }}"
          fi

          if [ "${{ job.status }}" == "success" ]; then
            COLOR=3066993; STATUS_EMOJI="✅"; STATUS_TEXT="배포 성공"
          else
            COLOR=15158528; STATUS_EMOJI="❌"; STATUS_TEXT="배포 실패"
          fi

          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{
                 \"content\": \"$STATUS_EMOJI **Frontend Development 배포 알림**\",
                 \"embeds\": [{
                   \"title\": \"🔧 [Development] $STATUS_TEXT\",
                   \"color\": $COLOR,
                   \"fields\": [
                     {\"name\": \"📦 저장소\", \"value\": \"\`${{ github.repository }}\`\", \"inline\": true},
                     {\"name\": \"🌿 브랜치\", \"value\": \"\`${{ github.ref_name }}\`\", \"inline\": true},
                     {\"name\": \"🔖 커밋\", \"value\": \"[\`$SHORT_SHA\`]($COMMIT_URL)\", \"inline\": true},
                     {\"name\": \"💬 커밋 메시지\", \"value\": \"$COMMIT_MSG\", \"inline\": false},
                     {\"name\": \"👤 작성자\", \"value\": \"$COMMIT_AUTHOR\", \"inline\": true},
                     {\"name\": \"📋 상세 로그\", \"value\": \"[Actions에서 확인]($ACTIONS_URL)\", \"inline\": true}
                   ],
                   \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
                 }]
               }" \
               ${{ secrets.DISCORD_WEBHOOK_URL }} || true

  deploy-staging:
    needs: build-and-push-arm64
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Deploy to Staging via SSM
        run: |
          set -euo pipefail

          APP_INSTANCE_ID="i-0d7fa2ecbb9d580ac"
          ECR_REGISTRY="${{ secrets.ECR_REGISTRY }}"
          IMAGE_URI="${ECR_REGISTRY}/doktori/frontend:${{ needs.build-and-push-arm64.outputs.image-tag }}"

          COMMANDS=$(jq -n --arg registry "$ECR_REGISTRY" --arg image "$IMAGE_URI" '[
            "set -e",
            ("export ECR_REGISTRY=" + $registry),
            ("export IMAGE_URI=" + $image),
            "export DOCKER_CONFIG=/tmp/.docker",
            "mkdir -p $DOCKER_CONFIG",
            "aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin $ECR_REGISTRY",
            "docker pull $IMAGE_URI",
            "docker rm -f app-frontend-1 2>/dev/null || true",
            "docker run -d --name app-frontend-1 --restart unless-stopped -p 3000:3000 $IMAGE_URI",
            "docker ps --filter name=app-frontend-1 --format \"table {{.Names}}\\t{{.Status}}\\t{{.Ports}}\"",
            "docker image prune -f"
          ]')

          CMD_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$APP_INSTANCE_ID" \
            --parameters "{\"commands\": $COMMANDS}" \
            --timeout-seconds 300 \
            --comment "deploy staging frontend ${{ github.sha }}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command: $CMD_ID"

          for i in $(seq 1 60); do
            sleep 5
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$CMD_ID" \
              --query "CommandInvocations[0].Status" \
              --output text 2>/dev/null || echo "Pending")
            echo "[$i/60] $STATUS"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut|DeliveryTimedOut)
                aws ssm list-command-invocations --command-id "$CMD_ID" --details \
                  --query "CommandInvocations[0].CommandPlugins[0].Output" --output text || true
                exit 1 ;;
            esac
          done
          echo "::error::SSM command timed out"
          exit 1

      - name: Notify Discord
        if: always()
        run: |
          ENV_NAME="staging"
          ENV_EMOJI="🧪"
          ENV_LABEL="Staging"

          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          ACTIONS_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMIT_MSG="${{ github.event.pull_request.title }}"
            COMMIT_AUTHOR="${{ github.event.pull_request.user.login }}"
          else
            COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | head -1)
            COMMIT_AUTHOR="${{ github.event.head_commit.author.name }}"
          fi

          if [ "${{ job.status }}" == "success" ]; then
            COLOR=3066993
            STATUS_EMOJI="✅"
            STATUS_TEXT="배포 성공"
          else
            COLOR=15158528
            STATUS_EMOJI="❌"
            STATUS_TEXT="배포 실패"
          fi

          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{
                 \"content\": \"$STATUS_EMOJI **Frontend $ENV_LABEL 배포 알림**\",
                 \"embeds\": [{
                   \"title\": \"$ENV_EMOJI [$ENV_LABEL] $STATUS_TEXT\",
                   \"color\": $COLOR,
                   \"fields\": [
                     {\"name\": \"📦 저장소\", \"value\": \"\`${{ github.repository }}\`\", \"inline\": true},
                     {\"name\": \"🌿 브랜치\", \"value\": \"\`${{ github.ref_name }}\`\", \"inline\": true},
                     {\"name\": \"🔖 커밋\", \"value\": \"[\`$SHORT_SHA\`]($COMMIT_URL)\", \"inline\": true},
                     {\"name\": \"💬 메시지\", \"value\": \"$COMMIT_MSG\", \"inline\": false},
                     {\"name\": \"👤 작성자\", \"value\": \"$COMMIT_AUTHOR\", \"inline\": true},
                     {\"name\": \"📋 상세 로그\", \"value\": \"[Actions에서 확인]($ACTIONS_URL)\", \"inline\": true}
                   ],
                   \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
                 }]
               }" \
               ${{ secrets.DISCORD_WEBHOOK_URL }} || true

  deploy-prod:
    needs: build-and-push-arm64
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create production CodeDeploy revision bundle
        run: |
          set -euo pipefail

          mkdir -p codedeploy-bundle/scripts/deploy/frontend

          cat > codedeploy-bundle/scripts/deploy/frontend/deploy.env <<EOF
          AWS_REGION=ap-northeast-2
          ECR_REGISTRY=${{ secrets.ECR_REGISTRY }}
          ECR_REPOSITORY=doktori/frontend
          IMAGE_TAG=${{ needs.build-and-push-arm64.outputs.image-tag }}
          CONTAINER_NAME=doktori-frontend
          HOST_PORT=3000
          CONTAINER_PORT=3000
          CONTAINER_STOP_TIMEOUT_SECONDS=30
          AWSLOGS_GROUP=/doktori/frontend
          AWSLOGS_STREAM_PREFIX=frontend-prod
          AWSLOGS_CREATE_GROUP=false
          HEALTH_CHECK_PATH=/health
          TARGET_GROUP_ARN=${{ secrets.FRONTEND_PROD_TARGET_GROUP_ARN }}
          EOF

          cp appspec.yml codedeploy-bundle/appspec.yml
          cp scripts/deploy/frontend/*.sh codedeploy-bundle/scripts/deploy/frontend/
          cp scripts/deploy/frontend/deploy.env.example codedeploy-bundle/scripts/deploy/frontend/

          REVISION_BUNDLE="frontend-codedeploy-${GITHUB_SHA}.zip"
          (
            cd codedeploy-bundle
            zip -r "../${REVISION_BUNDLE}" .
          )

          echo "REVISION_BUNDLE=${REVISION_BUNDLE}" >> "$GITHUB_ENV"

      - name: Upload CodeDeploy revision to S3
        run: |
          set -euo pipefail

          aws s3 cp "$REVISION_BUNDLE" \
            "s3://${{ secrets.CODEDEPLOY_REVISION_BUCKET_PROD }}/frontend/${REVISION_BUNDLE}"

      - name: Register CodeDeploy revision
        run: |
          set -euo pipefail

          aws deploy register-application-revision \
            --application-name "${{ secrets.CODEDEPLOY_APPLICATION_NAME_PROD }}" \
            --s3-location "bucket=${{ secrets.CODEDEPLOY_REVISION_BUCKET_PROD }},bundleType=zip,key=frontend/${REVISION_BUNDLE}"

      - name: Create CodeDeploy deployment
        run: |
          set -euo pipefail

          DEPLOYMENT_ID=$(
            aws deploy create-deployment \
              --application-name "${{ secrets.CODEDEPLOY_APPLICATION_NAME_PROD }}" \
              --deployment-group-name "${{ secrets.CODEDEPLOY_DEPLOYMENT_GROUP_NAME_PROD }}" \
              --revision "revisionType=S3,s3Location={bucket=${{ secrets.CODEDEPLOY_REVISION_BUCKET_PROD }},bundleType=zip,key=frontend/${REVISION_BUNDLE}}" \
              --description "frontend prod deploy ${GITHUB_SHA}" \
              --query 'deploymentId' \
              --output text
          )

          echo "DEPLOYMENT_ID=${DEPLOYMENT_ID}" >> "$GITHUB_ENV"
          echo "CodeDeploy Deployment: ${DEPLOYMENT_ID}"

      - name: Wait for CodeDeploy deployment
        run: |
          set -euo pipefail

          for i in $(seq 1 120); do
            STATUS=$(aws deploy get-deployment \
              --deployment-id "$DEPLOYMENT_ID" \
              --query 'deploymentInfo.status' \
              --output text)
            echo "[$i/120] CodeDeploy status: $STATUS"

            case "$STATUS" in
              Succeeded)
                exit 0
                ;;
              Failed|Stopped)
                aws deploy get-deployment \
                  --deployment-id "$DEPLOYMENT_ID" \
                  --output json
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "::error::CodeDeploy deployment timed out"
          exit 1

      - name: Sync .next/static to S3
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECR_REPOSITORY: doktori/frontend
          IMAGE_TAG: ${{ needs.build-and-push-arm64.outputs.image-tag }}
          STATIC_BUCKET_NAME: ${{ secrets.STATIC_BUCKET_NAME_PROD }}
        run: |
          set -euo pipefail

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker pull "$IMAGE_URI"
          CONTAINER_ID=$(docker create "$IMAGE_URI")
          trap 'docker rm -f "$CONTAINER_ID" >/dev/null 2>&1 || true' EXIT

          rm -rf /tmp/frontend-static
          mkdir -p /tmp/frontend-static
          docker cp "$CONTAINER_ID:/app/.next/static" /tmp/frontend-static/static

          # Keep older build assets available so mixed-version traffic during rolling deploys
          # does not lose chunks that are still referenced by already-rendered HTML.
          aws s3 sync /tmp/frontend-static/static/ "s3://${STATIC_BUCKET_NAME}/_next/static/"

      - name: Create CloudFront invalidation
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_PROD }}
        run: |
          set -euo pipefail

          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"

      - name: Notify Discord
        if: always()
        run: |
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          ACTIONS_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMIT_MSG="${{ github.event.pull_request.title }}"
            COMMIT_AUTHOR="${{ github.event.pull_request.user.login }}"
          else
            COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | head -1)
            COMMIT_AUTHOR="${{ github.event.head_commit.author.name }}"
          fi

          if [ "${{ job.status }}" == "success" ]; then
            COLOR=3066993; STATUS_EMOJI="✅"; STATUS_TEXT="배포 성공"
          else
            COLOR=15158528; STATUS_EMOJI="❌"; STATUS_TEXT="배포 실패"
          fi

          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{
                 \"content\": \"$STATUS_EMOJI **Frontend Production 배포 알림**\",
                 \"embeds\": [{
                   \"title\": \"🚀 [Production] $STATUS_TEXT\",
                   \"color\": $COLOR,
                   \"fields\": [
                     {\"name\": \"📦 저장소\", \"value\": \"\`${{ github.repository }}\`\", \"inline\": true},
                     {\"name\": \"🌿 브랜치\", \"value\": \"\`${{ github.ref_name }}\`\", \"inline\": true},
                     {\"name\": \"🔖 커밋\", \"value\": \"[\`$SHORT_SHA\`]($COMMIT_URL)\", \"inline\": true},
