name: Frontend CI/CD

on:
  push:
    branches:
      - staging
    paths-ignore:
      - "*.md"
      - "docs/**"
  pull_request:
    branches:
      - staging
    types:
      - closed

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'staging' &&
       github.event.pull_request.head.ref == 'develop')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run ESLint
        run: pnpm run lint

      - name: Check Prettier formatting
        run: pnpm run format:check

      - name: Notify Discord on failure
        if: failure()
        run: |
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | head -1)
          COMMIT_AUTHOR="${{ github.event.head_commit.author.name }}"
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          ACTIONS_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{
                 \"content\": \"❌ **Frontend CI 실패**\",
                 \"embeds\": [{
                   \"title\": \"🔴 빌드 실패 알림\",
                   \"color\": 15158528,
                   \"fields\": [
                     {\"name\": \"📦 저장소\", \"value\": \"\`${{ github.repository }}\`\", \"inline\": true},
                     {\"name\": \"🌿 브랜치\", \"value\": \"\`${{ github.ref_name }}\`\", \"inline\": true},
                     {\"name\": \"🔖 커밋\", \"value\": \"[\`$SHORT_SHA\`]($COMMIT_URL)\", \"inline\": true},
                     {\"name\": \"💬 커밋 메시지\", \"value\": \"$COMMIT_MSG\", \"inline\": false},
                     {\"name\": \"👤 작성자\", \"value\": \"$COMMIT_AUTHOR\", \"inline\": true},
                     {\"name\": \"📋 상세 로그\", \"value\": \"[Actions에서 확인]($ACTIONS_URL)\", \"inline\": true}
                   ],
                   \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
                 }]
               }" \
               ${{ secrets.DISCORD_WEBHOOK_URL }} || true

  build-and-push-arm64:
    needs: ci
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'staging' &&
       github.event.pull_request.head.ref == 'develop')
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        run: |
          REGISTRY="${{ secrets.ECR_REGISTRY }}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          ARCH="arm64"
          TAG="sha-${SHORT_SHA}-${ARCH}"
          {
            echo "tags<<EOF"
            echo "${REGISTRY}/doktori/frontend:${TAG}"
            echo "${REGISTRY}/doktori/frontend:staging-${ARCH}"
            echo "EOF"
          } >> $GITHUB_OUTPUT
          echo "image-tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare frontend build env file
        run: |
          cat <<'EOF' > .env.build
          NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL_PROD }}
          NEXT_PUBLIC_CHAT_BASE_URL=${{ secrets.NEXT_PUBLIC_CHAT_BASE_URL_DEV }}
          NEXT_PUBLIC_CHAT_WS_PATH=${{ secrets.NEXT_PUBLIC_CHAT_WS_PATH_DEV }}
          NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY_DEV }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN_DEV }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID_DEV }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET_DEV }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID_DEV }}
          NEXT_PUBLIC_GA_ID=${{ secrets.NEXT_PUBLIC_GA_ID_PROD }}
          NEXT_PUBLIC_FIREBASE_APPID=${{ secrets.NEXT_PUBLIC_FIREBASE_APPID_DEV }}
          NEXT_PUBLIC_FIREBASE_VAPID_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY_DEV }}
          NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN_PROD }}
          NEXT_PUBLIC_SENTRY_ENV=staging
          EOF

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          target: runner
          tags: ${{ steps.meta.outputs.tags }}
          secret-files: |
            frontend_env=.env.build

  deploy-staging:
    needs: build-and-push-arm64
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'staging' &&
       github.event.pull_request.head.ref == 'develop')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Deploy to Staging via SSM
        run: |
          STAGING_INSTANCE_ID="i-0212b65a2dfba8335"

          COMMANDS=$(jq -n --arg registry "${{ secrets.ECR_REGISTRY }}" --arg tag "${{ needs.build-and-push-arm64.outputs.image-tag }}" '[
            "set -e",
            ("export ECR_REGISTRY=" + $registry),
            ("export IMAGE_URI=" + $registry + "/doktori/frontend:" + $tag),
            "export DOCKER_CONFIG=/tmp/.docker",
            "mkdir -p $DOCKER_CONFIG",
            "aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin $ECR_REGISTRY",
            "docker pull $IMAGE_URI",
            "docker tag $IMAGE_URI $ECR_REGISTRY/doktori/frontend:staging-arm64",
            "if docker compose version >/dev/null 2>&1; then docker compose -f /home/ubuntu/app/docker-compose.yml up -d --no-deps frontend; else docker-compose -f /home/ubuntu/app/docker-compose.yml up -d --no-deps frontend; fi",
            "docker image prune -f"
          ]')

          RESP=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$STAGING_INSTANCE_ID" \
            --parameters "{\"commands\": $COMMANDS}" \
            --timeout-seconds 300 \
            --comment "deploy staging frontend ${{ github.sha }}" \
            --output json)

          CMD_ID=$(echo "$RESP" | jq -r '.Command.CommandId')
          TARGET_COUNT=$(echo "$RESP" | jq -r '.Command.TargetCount // 0')
          echo "SSM Command: $CMD_ID (targets: $TARGET_COUNT)"
          if [ "$TARGET_COUNT" -eq 0 ]; then
            echo "::error::No SSM targets matched for staging deploy"
            exit 1
          fi


          for i in $(seq 1 60); do
            sleep 5
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$CMD_ID" \
              --query "CommandInvocations[0].Status" \
              --output text 2>/dev/null || echo "Pending")
            if [ -z "$STATUS" ] || [ "$STATUS" = "None" ]; then
              STATUS="Pending"
            fi
            echo "[$i/60] $STATUS"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut|DeliveryTimedOut)
                aws ssm list-command-invocations --command-id "$CMD_ID" --details \
                  --query "CommandInvocations[0].CommandPlugins[0].Output" --output text || true
                exit 1 ;;
            esac
          done
          echo "::error::SSM command timed out"
          exit 1

      - name: Notify Discord
        if: always()
        run: |
          ENV_NAME="staging"
          ENV_EMOJI="🧪"
          ENV_LABEL="Staging"

          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          ACTIONS_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMIT_MSG="${{ github.event.pull_request.title }}"
            COMMIT_AUTHOR="${{ github.event.pull_request.user.login }}"
          else
            COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | head -1)
            COMMIT_AUTHOR="${{ github.event.head_commit.author.name }}"
          fi

          if [ "${{ job.status }}" == "success" ]; then
            COLOR=3066993
            STATUS_EMOJI="✅"
            STATUS_TEXT="배포 성공"
          else
            COLOR=15158528
            STATUS_EMOJI="❌"
            STATUS_TEXT="배포 실패"
          fi

          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{
                 \"content\": \"$STATUS_EMOJI **Frontend $ENV_LABEL 배포 알림**\",
                 \"embeds\": [{
                   \"title\": \"$ENV_EMOJI [$ENV_LABEL] $STATUS_TEXT\",
                   \"color\": $COLOR,
                   \"fields\": [
                     {\"name\": \"📦 저장소\", \"value\": \"\`${{ github.repository }}\`\", \"inline\": true},
                     {\"name\": \"🌿 브랜치\", \"value\": \"\`${{ github.ref_name }}\`\", \"inline\": true},
                     {\"name\": \"🔖 커밋\", \"value\": \"[\`$SHORT_SHA\`]($COMMIT_URL)\", \"inline\": true},
                     {\"name\": \"💬 메시지\", \"value\": \"$COMMIT_MSG\", \"inline\": false},
                     {\"name\": \"👤 작성자\", \"value\": \"$COMMIT_AUTHOR\", \"inline\": true},
                     {\"name\": \"📋 상세 로그\", \"value\": \"[Actions에서 확인]($ACTIONS_URL)\", \"inline\": true}
                   ],
                   \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
                 }]
               }" \
               ${{ secrets.DISCORD_WEBHOOK_URL }} || true
